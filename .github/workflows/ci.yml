name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.12.12
      - run: ruff check src tests
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
