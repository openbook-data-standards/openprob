[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openprob"
version = "0.1.0"
description = "Experimental provider-neutral probabilistic forecasts and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
